name: Update & Ensure Latest Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote-latest:
    name: 📌 Update & Promote Release to Latest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Promote Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.11.1
          name: Guidegram v1.11.1
          body_path: RELEASE_NOTES.md
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
