name: 🐛 Bug Report
description: Report an issue, crash, or unexpected behavior in Guidegram.
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ### Thank you for reporting an issue! 🛡️
        Please provide detailed reproduction steps so we can isolate and resolve the issue quickly.
        **⚠️ DO NOT POST PRIVATE DATA:** Never paste phone numbers, 2FA passwords, or MTProto session strings.

  - type: input
    id: version
    attributes:
      label: 🏷️ Guidegram Version
      placeholder: "v1.7.0"
    validations:
      required: true

  - type: dropdown
    id: installation_type
    attributes:
      label: 📦 Package Type & OS
      options:
        - "Windows Standalone Portable ZIP (x64)"
        - "Windows NSIS Setup Installer (x64)"
        - "macOS Universal DMG (Apple Silicon / Intel)"
        - "Linux AppImage"
        - "Built from source (git clone & pnpm dev)"
    validations:
      required: true

  - type: textarea
    id: bug_description
    attributes:
      label: 💥 Bug Description
      description: What happened? What did you expect to happen instead?
      placeholder: "Describe the bug clearly..."
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: 🔁 Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Open Guidegram
        2. Go to Proxy Settings...
        3. Click 'Add Account'...
        4. See error...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 📜 Diagnostic Logs (Sanitized)
      description: Relevant logs from `./data/logs/guidegram.log` or Developer Tools Console (F12).
      render: text
      placeholder: "Paste sanitized log output here..."
    validations:
      required: false

  - type: checkboxes
    id: sanitization_check
    attributes:
      label: 🛡️ Security Verification
      options:
        - label: "I have inspected the logs above and verified that all sensitive phone numbers, IPs, and session tokens have been redacted."
          required: true
