<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0d14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Guidegram</title>
    <!-- Vazirmatn for Persian/Arabic and Open Sans for Latin/English (Telegram standard typography) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-dark-950 text-gray-100 antialiased select-none overflow-hidden h-[100dvh] w-full">
    <div id="root" class="h-full w-full"></div>
    <!-- Global SVG defs for Telegram channel droplet avatar clipPath -->
    <svg class="absolute w-0 h-0 pointer-events-none opacity-0" aria-hidden="true" focusable="false">
      <defs>
        <clipPath id="guidegram-avatar-droplet" clipPathUnits="objectBoundingBox">
          <path d="M 0.5 0 C 0.68 0.18, 0.95 0.38, 0.95 0.55 A 0.45 0.45 0 1 1 0.05 0.55 C 0.05 0.38, 0.32 0.18, 0.5 0 Z" />
        </clipPath>
      </defs>
    </svg>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
